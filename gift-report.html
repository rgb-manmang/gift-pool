<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>🎂 生日礼物 · 观阅版</title>
<style>
:root{
  --bg:#f4f7f5; --card:#ffffff; --ink:#1f2733; --ink2:#5b6675; --ink3:#98a2b3; --line:#e6ece8; --line2:#dde5e0;
  --green:#5fb88e; --green2:#4ea87a; --green-bg:#e9f6ee; --green-bg2:#f2faf5; --green-line:#cfe8d8;
  --red:#d64545; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 2px 8px rgba(0,0,0,.05),0 12px 36px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

/* ===== 顶部标题（明文无密码） ===== */
.viewer-report-head{max-width:720px;margin:6px auto 14px;padding:18px 16px 6px;background:none;border:none;border-radius:0}
.viewer-report-head h1{font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:10px;color:#1f2733;font-weight:700;justify-content:center}
.viewer-report-head h1 .ico{font-size:24px}
.viewer-report-head .meta{margin-top:8px;font-size:12.5px;color:#98a2b3;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ===== 寿星卡片（铺满屏宽：名字行+按钮一行，其余全宽堆叠） ===== */
.viewer-list{max-width:720px;margin:0 auto;padding:0 12px 200px}
.viewer-person{max-width:720px;margin:0 auto 14px;background:#fff;border:1px solid #e6ece8;border-radius:18px;padding:14px 14px;display:block;transition:background .18s,border-color .18s,box-shadow .18s}
.viewer-person.is-picked{background:linear-gradient(180deg,#fff7e6 0%,#ffe8b8 100%);border-color:#f0c97a;box-shadow:0 4px 14px -8px rgba(200,162,83,.45)}
.viewer-person.is-picked .vname{color:#7a5618}
.viewer-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.viewer-name-row .vname{font-size:18px;font-weight:600;color:#1f2733}
.viewer-name-row .vdate{font-size:13px;color:#5b6675}
.viewer-name-row .badge-vip{font-size:11.5px;padding:2px 8px;background:#fbf4e2;color:#d8b25a;border-radius:99px;font-weight:600}
.viewer-name-row .badge-staff{font-size:11.5px;padding:2px 8px;background:#eef2f6;color:#7a8696;border-radius:99px;font-weight:600}
.viewer-name-row .picked-tag{font-size:11.5px;padding:2px 8px;background:#e9f6ee;color:#5fb88e;border-radius:99px;font-weight:600}
/* 名字行右侧的"为他/她选礼物"按钮 */
.viewer-name-row .picker-btn{margin-left:auto;flex:none;padding:8px 14px;background:#5fb88e;color:#fff;border-radius:99px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:.16s}
.viewer-name-row .picker-btn.is-open{background:#3a7a5b}

/* 选中的礼物：迷你小窗口（价格红字+大字号） */
.picked-mini{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;background:#f2faf5;border:1px solid #cfe8d8;border-radius:12px;max-width:360px;box-shadow:0 2px 8px -4px rgba(95,184,142,.25)}
.picked-mini .pm-img{width:46px;height:46px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:none;border:1px solid #e0eee6}
.picked-mini .pm-img img{width:100%;height:100%;object-fit:cover;display:block}
.picked-mini .pm-body{flex:1;min-width:0}
.picked-mini .pm-name{font-size:13.5px;font-weight:700;color:#1f2733;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picked-mini .pm-price{font-size:14px;font-weight:700;color:#d64545;margin-top:2px;letter-spacing:-.01em}
.picked-mini .pm-price .yen{font-size:11px;font-weight:500;margin-right:1px}
.picked-mini .pm-tag{font-size:11px;color:#1f6e3d;background:#dcf2e4;border-radius:99px;padding:3px 9px;flex:none;font-weight:600;white-space:nowrap}

/* 留言输入（手动文字，随提交传回后台） */
.msg-row{margin-top:12px}
.msg-input{width:100%;padding:11px 13px;border:1.5px solid #e6ece8;border-radius:12px;font-size:13.5px;font-family:inherit;outline:none;background:#fff;color:#1f2733;transition:.16s}
.msg-input:focus{border-color:#5fb88e;box-shadow:0 0 0 3px rgba(95,184,142,.12)}
.msg-input::placeholder{color:#b6bfc9}

/* ===== 行内展开的 picker（点开即展开，不弹窗） ===== */
.inline-picker{display:none;margin:14px -15px 0;padding:12px 10px 14px;background:#f4f7f5;border-top:1px solid #dde5e5;border-bottom:1px solid #dde5e5;border-radius:0}
.inline-picker.open{display:block;animation:expandIn .22s ease}
@keyframes expandIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.inline-picker .ip-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.inline-picker .ip-ttl{font-size:13.5px;color:#5b6675;font-weight:600}
.inline-picker .ip-close{width:26px;height:26px;border-radius:50%;border:1px solid #dde5e5;background:#fff;color:#5b6675;cursor:pointer;font-family:inherit;font-size:13px;display:flex;align-items:center;justify-content:center;line-height:1}
.inline-picker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ipick-card{background:#fff;border:1px solid #e6ece8;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;font-family:inherit;transition:.16s}
.ipick-card.is-picked{border-color:#5fb88e;box-shadow:0 0 0 1px #b9ecce inset;background:#f6fcf8}
.ipick-card .ip-img{width:100%;aspect-ratio:1/1.12;object-fit:cover;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#cbd1dd;font-size:26px}
.ipick-card .ip-img img{width:100%;height:100%;object-fit:cover;display:block}
.ipick-card .ip-body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.ipick-card .ip-name{font-size:13.5px;font-weight:600;color:#1f2733;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ipick-card .ip-price{font-size:12px;color:#98a2b3}
.ipick-card .ip-expect{display:inline-block;font-size:10.5px;padding:1px 7px;background:#fbf4e2;color:#d8b25a;border-radius:99px;font-weight:600;align-self:flex-start}
.ipick-card .ip-pick{margin-top:8px;padding:9px 0;border-radius:9px;border:1px solid #e6ece8;background:#fff;color:#5b6675;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;width:100%}
.ipick-card.is-picked .ip-pick{background:#5fb88e;border-color:#5fb88e;color:#fff}
.ipick-card .ip-pick .ip-box{display:inline-block;width:14px;height:14px;border-radius:3px;border:1.5px solid #cfcfcf;vertical-align:-2px;margin-right:5px;font-size:10px;line-height:1;color:transparent}
.ipick-card.is-picked .ip-pick .ip-box{background:#fff;border-color:#fff;color:#5fb88e}

/* ===== 3 个动作芯片（在选礼物面板最底部） + 留言 ===== */
.viewer-actions{display:flex;margin-top:14px;flex-wrap:wrap;gap:9px;padding-top:14px;border-top:1px dashed #dde5e5;justify-content:center}
.va-chip{font-size:12.5px;padding:8px 15px;border-radius:99px;border:1px solid #e6ece8;background:#fff;color:#5b6675;cursor:pointer;font-family:inherit;font-weight:600;transition:.16s;display:flex;align-items:center;gap:5px}
.va-chip:active{transform:scale(.95)}
.va-chip.on{border-color:#5fb88e;background:#e9f6ee;color:#2d7d52;box-shadow:0 1px 3px rgba(95,184,142,.15)}

/* ===== 底部固定 提交/取消 按钮栏 ===== */
.viewer-foot-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(244,247,245,.96);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid #e6ece8;padding:12px 16px;display:flex;align-items:center;gap:10px;justify-content:center}
.viewer-foot-bar .vf-meta{font-size:12.5px;color:#5b6675;margin-right:6px}
.vsr-btn{padding:12px 26px;border:none;border-radius:99px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.16s;letter-spacing:.5px}
.vsr-btn.primary{background:#5fb88e;color:#fff;box-shadow:0 6px 20px -6px rgba(95,184,142,.5)}
.vsr-btn.primary:disabled{background:#a3c8b6;cursor:not-allowed;transform:none;box-shadow:none}
.vsr-btn.ghost{background:transparent;color:#5b6675;border:1px solid #dde5e5}

/* ===== 悬停效果：只在真正带鼠标的设备上启用（避免手机点按后 hover 样式"粘住"） ===== */
@media (hover:hover) and (pointer:fine){
  .viewer-name-row .picker-btn:hover{background:#4ea87a}
  .inline-picker .ip-close:hover{background:#e9f6ee;color:#5fb88e;border-color:#5fb88e}
  .ipick-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px -6px rgba(95,184,142,.25);border-color:#cfe8d8}
  .ipick-card .ip-pick:hover{border-color:#5fb88e;color:#5fb88e}
  .va-chip:hover{border-color:#5fb88e;color:#5fb88e}
  .vsr-btn.primary:hover{background:#4ea87a;transform:translateY(-1px)}
  .vsr-btn.ghost:hover{background:#fff;border-color:#5b6675;color:#1f2733}
}

/* ===== 报告底部 ===== */
.viewer-foot{max-width:720px;margin:24px auto 0;text-align:center;font-size:11.5px;color:#98a2b3;padding:0 16px}

/* ===== toast ===== */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(90px);background:rgba(29,29,31,.94);color:#fff;padding:12px 26px;border-radius:99px;font-size:13.5px;z-index:300;transition:.32s cubic-bezier(.32,.72,0,1);opacity:0;box-shadow:0 8px 30px rgba(0,0,0,.2);pointer-events:none;backdrop-filter:blur(10px);font-weight:500;max-width:88vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ===== 同步状态条 ===== */
.sync-stat{position:fixed;top:8px;right:8px;font-size:11px;color:#98a2b3;background:rgba(255,255,255,.85);border:1px solid #e6ece8;border-radius:99px;padding:4px 11px;z-index:55;backdrop-filter:blur(8px);font-weight:500;pointer-events:none;opacity:.85}
.sync-stat.warn{color:#b0620d;background:#fff7ed;border-color:#fdba74}
.sync-stat.ok{color:#1f6e3d;background:#e9f6ee;border-color:#cfe8d8}

/* ===== 空状态 ===== */
.empty-state{text-align:center;padding:80px 20px;color:#5b6675}
.empty-state .big{font-size:46px;margin-bottom:14px;opacity:.35}
.empty-state p{font-size:14.5px}

/* 隐藏滚动条美化 */
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#d6d6d6;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#a8a8a8}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>

<script>
"use strict";

/* ====== 配置（观阅版免密码；token 用 XOR 轻量混淆规避仓库推送拦截；可见即可反解，安全等级约等于明文） ====== */
const _TOK_B64 = 'VAsFOXoUeHAMEl0nHypRP3dKCQMCU0AFRB4nQz0XWVUkIQUqelU0Rg==';
const _TOK_KEY = 'M2N1ZjRyTjJ5cA==';
function _decTok(){
  const e = atob(_TOK_B64), k = atob(_TOK_KEY);
  let s = '';
  for (let i=0;i<e.length;i++) s += String.fromCharCode(e.charCodeAt(i) ^ k.charCodeAt(i % k.length));
  return s;
}
const GH_SYNC = {
  token: _decTok(),
  repo:  'rgb-manmang/gift-pool',
  dataPath: 'data.enc',
  keyHex: 'f1d9f827111d4cc495899a47b8812bbf5389a29775d9086dc038e686d0dc431d',
  hosts: ['https://cors.isteed.cc/https://api.github.com', 'https://api.github.com'],
};
const GH_PAGES_BASE = 'https://rgb-manmang.github.io/gift-pool/';
const STORAGE_KEY = 'gp_view_picks_v1';
const MONTH = new Date().getMonth() + 1;
const YEAR  = new Date().getFullYear();

/* ====== 工具 ====== */
const $ = s => document.querySelector(s);
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function syncBadge(txt, cls){
  const el = $('#sync-stat');
  if (!el) return;
  el.textContent = txt;
  el.classList.remove('warn','ok');
  if (cls) el.classList.add(cls);
}
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seededShuffle(arr, seed){ const rnd = mulberry32(seed); const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){ return (s||'').toLowerCase().replace(/[\s\u3000]/g,''); }
function priceText(g){
  if (g.price) return '<span class="yen">¥</span>' + Number(g.price).toLocaleString();
  return esc(g.priceRaw || '价格待询');
}
function _hexBytes(hex){
  const a = new Uint8Array(hex.length/2);
  for (let i=0;i<a.length;i++) a[i] = parseInt(hex.substr(i*2,2),16);
  return a;
}
async function _dataKey(){ return crypto.subtle.importKey('raw', _hexBytes(GH_SYNC.keyHex), 'AES-GCM', false, ['encrypt','decrypt']); }
async function encryptState(obj){
  const key = await _dataKey();
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const ct  = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  const out = new Uint8Array(12 + ct.byteLength);
  out.set(iv, 0); out.set(new Uint8Array(ct), 12);
  return out;
}
async function decryptState(u8){
  const key = await _dataKey();
  const pt  = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8.subarray(0,12)}, key, u8.subarray(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function _b64ToU8(b64){ b64=b64.replace(/\s+/g,''); const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }
function _u8ToB64(u8){ let s=''; for(let i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); }

/* ====== 云端读写（与后台共用同一份 data.enc；提交用轻量 push） ====== */
let _ghHost = 0;
async function ghFetch(path, opts){
  opts = opts || {};
  let lastErr = null;
  for (let i=0;i<GH_SYNC.hosts.length;i++){
    const idx = (_ghHost + i) % GH_SYNC.hosts.length;
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 12000);
    try {
      const r = await fetch(GH_SYNC.hosts[idx] + path, {
        method: opts.method || 'GET',
        headers: Object.assign({'Authorization':'token '+GH_SYNC.token,'Accept':'application/vnd.github.v3+json'}, opts.headers||{}),
        body: opts.body || undefined,
        cache:'no-store',
        signal: ctrl.signal,
      });
      clearTimeout(timer);
      _ghHost = idx;
      return r;
    } catch(e){ clearTimeout(timer); lastErr=e; }
  }
  throw lastErr || new Error('network');
}
async function cloudGet(){
  const r = await ghFetch('/repos/' + GH_SYNC.repo + '/contents/' + GH_SYNC.dataPath + '?t=' + Date.now());
  if (r.status === 404) return {sha:null, state:null};
  if (!r.ok) throw new Error('cloudGet HTTP ' + r.status);
  const j = await r.json();
  return {sha:j.sha, state:await decryptState(_b64ToU8(j.content))};
}
async function cloudPut(sha, encU8){
  const body = {message:'viewer submit '+new Date().toISOString(), content:_u8ToB64(encU8), branch:'main'};
  if (sha) body.sha = sha;
  const r = await ghFetch('/repos/' + GH_SYNC.repo + '/contents/' + GH_SYNC.dataPath, {
    method:'PUT', body:JSON.stringify(body), headers:{'Content-Type':'application/json'},
  });
  if (!r.ok) return null;
  try { const j = await r.json(); return (j.content && j.content.sha) || 'ok'; } catch(e){ return 'ok'; }
}

/* ====== 数据加载：先本地缓存，再云端（每 45s 拉一次） ====== */
let state = null;
function loadState(){
  const builtin = JSON.parse(document.getElementById('builtin-data').textContent);
  state = builtin;
}
function imgSrc(g){
  if (!g) return '';
  if (g.imgUrl) return GH_PAGES_BASE + g.imgUrl;
  if (g.img) return g.img;
  return '';
}
function findPerson(id){ return (state.people||[]).find(p => p.id === id); }
function findGiftById(id){
  if (state.vip)   { const v = state.vip.find(g=>g.id===id);   if (v) return v; }
  if (state.staff) { const s = state.staff.find(g=>g.id===id); if (s) return s; }
  return null;
}

/* ====== 观阅版选礼物（本地 + 可提交到云端） ====== */
// 内存视图：picks[pid] = { gid, name, gift, price, status, ask, remind, resetMark, at }
let picks = {};
// 记录哪些人的选礼物面板处于展开状态（卡片局部刷新后保持不收起）
const openPickers = new Set();
function loadPicks(){ try{ picks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; } catch(e){ picks = {}; } }
function savePicks(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(picks)); } catch(e){} }

function togglePick(pid, gid){
  const p = findPerson(pid);
  const g = findGiftById(gid);
  const cur = picks[pid] || {};
  if (cur.gid === gid){
    // 再点一次：取消该选择
    cur.gid = null; cur.gift = null; cur.price = null; cur.name = p ? p.name : '';
  } else {
    cur.gid = gid; cur.gift = g ? g.name : '';
    cur.price = g ? g.price : null;
    cur.name = p ? p.name : '';
  }
  cur.at = Date.now();
  picks[pid] = cur;
  savePicks();
  // 局部刷新该卡片
  refreshCard(pid);
  updateFootBar();
  toast(cur.gid ? ('✅ 已选：' + cur.gift) : '已取消选择');
}
// 观阅版领导自勾选的 3 个内联动作：🔁 重新选择（清该人 gift） / ❓ 询问本人 / 🔔 提醒DJ
function toggleAction(pid, key){
  const cur = picks[pid] || { name: (findPerson(pid)||{}).name||'', gid:null, gift:null, price:null, at:0 };
  cur[key] = !cur[key];
  cur.at = Date.now();
  cur.name = (findPerson(pid)||{}).name || cur.name || '';
  picks[pid] = cur;
  savePicks();
  refreshCard(pid);
  updateFootBar();
  const labels = {ask:'询问本人', remind:'提醒 DJ', resetMark:'重新选择'};
  const name = labels[key] || '标记';
  toast(cur[key] ? ('✅ 已标记「' + name + '」') : ('已取消「' + name + '」，恢复原样'));
}
// 留言：手动输入文字（防抖保存，不重渲染卡片以免丢焦点）
let _msgTimer = null;
function saveMsg(pid, val){
  const cur = picks[pid] || { name: (findPerson(pid)||{}).name||'', gid:null, gift:null, price:null, at:0 };
  cur.msg = val;
  cur.name = (findPerson(pid)||{}).name || cur.name || '';
  picks[pid] = cur;
  clearTimeout(_msgTimer);
  _msgTimer = setTimeout(savePicks, 400);
  updateFootBar();
}
function resetPicks(){
  if (!confirm('清空当前所有勾选（包括 3 个标记动作）？')) return;
  picks = {};
  savePicks();
  renderList();
  updateFootBar();
  toast('已清空');
}

/* ====== 渲染 ====== */
// 是否往年送过（名字相似即算）
function wasSent(person, gift){
  const n = norm(gift.name);
  if (n.length < 2) return false;
  return Object.values(person.gifts||{}).some(g => {
    const s = norm(g);
    if (s.length < 2) return false;
    return n.includes(s) || s.includes(n);
  });
}
// 候选固定 6 个：后台勾选的 candidates 优先，不够的用推荐补齐（避开往年送过的），绝不出全池
function pickerList(pid){
  const p = findPerson(pid);
  if (!p) return [];
  const seen = new Set(), list = [];
  const tier = p.tier === 'vip' ? 'vip' : 'staff';
  const MAX = 6;
  // 1) 后台选定的候选清单优先
  (p.candidates || []).forEach(id => {
    if (list.length >= MAX) return;
    const g = findGiftById(id);
    if (g && !seen.has(g.id)){ seen.add(g.id); list.push(g); }
  });
  // 2) 不够 6 个 → 本层级池推荐补齐（优先没送过的）
  if (list.length < MAX){
    const pool = (state[tier] || []);
    const fresh = pool.filter(g => !seen.has(g.id) && !wasSent(p, g));
    const rest  = pool.filter(g => !seen.has(g.id));
    const fillFrom = fresh.length ? fresh : rest;
    seededShuffle(fillFrom, (p.recoSeed || 0) + 7).forEach(g => {
      if (list.length >= MAX) return;
      if (!seen.has(g.id)){ seen.add(g.id); list.push(g); }
    });
  }
  // 3) 仍不够 → 跨层级兜底
  if (list.length < MAX){
    const cross = (tier === 'vip' ? (state.staff || []) : (state.vip || [])).filter(g => !seen.has(g.id));
    seededShuffle(cross, (p.recoSeed || 0) + 13).forEach(g => {
      if (list.length >= MAX) return;
      if (!seen.has(g.id)){ seen.add(g.id); list.push(g); }
    });
  }
  return list;
}
function personCardHTML(p){
  const cur = picks[p.id] || {};
  const pickedG = cur.gid ? findGiftById(cur.gid) : null;
  const dateStr = (p.month||'') + ' 月' + (p.day ? ' ' + p.day + ' 日' : '');
  const vipBadge = p.tier === 'vip' ? '<span class="badge-vip">VIP</span>' : '<span class="badge-staff">普通员工</span>';

  // 选中礼物 → 迷你窗口
  let miniHTML = '';
  if (pickedG){
    const s = imgSrc(pickedG);
    const imgHTML = s ? `<img src="${esc(s)}" alt="" onerror="this.remove()">` : '🎁';
    miniHTML = `<div class="picked-mini">
      <div class="pm-img">${imgHTML}</div>
      <div class="pm-body">
        <div class="pm-name">${esc(pickedG.name)}</div>
        <div class="pm-price">${priceText(pickedG)}</div>
      </div>
      <span class="pm-tag">✓ 已选择</span>
    </div>`;
  }

  // 行内 picker（默认收起；openPickers 记住展开状态，卡片局部刷新后不收起）
  const gifts = pickerList(p.id);
  const isOpen = openPickers.has(p.id);
  const pickerHTML = `
    <div class="inline-picker${isOpen?' open':''}" id="ip-${esc(p.id)}">
      <div class="ip-head">
        <span class="ip-ttl">🎁 为 ${esc(p.name)} 选礼物（共 ${gifts.length} 个候选）</span>
        <button class="ip-close" onclick="togglePicker('${esc(p.id)}')" title="收起">✕</button>
      </div>
      <div class="inline-picker-grid">
        ${gifts.map(g => {
          const picked = cur.gid === g.id;
          const src = imgSrc(g);
          const imgHTML2 = src ? `<img src="${esc(src)}" alt="" onerror="this.remove()">` : '🖼';
          const expectBadge = g.expect ? '<span class="ip-expect">🌟 同学期待</span>' : '';
          return `<div class="ipick-card${picked?' is-picked':''}" data-gid="${esc(g.id)}">
            <div class="ip-img">${imgHTML2}</div>
            <div class="ip-body">
              <div class="ip-name">${esc(g.name)}</div>
              <div class="ip-price">${priceText(g)}</div>
              ${expectBadge}
              <button class="ip-pick" onclick="togglePick('${esc(p.id)}','${esc(g.id)}')"><span class="ip-box">✓</span>${picked?'已选它':'选这个'}</button>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="viewer-actions" id="va-${esc(p.id)}">
        <button class="va-chip${cur.resetMark?' on':''}" onclick="toggleAction('${esc(p.id)}','resetMark')">🔁 重新选择</button>
        <button class="va-chip${cur.ask?' on':''}" onclick="toggleAction('${esc(p.id)}','ask')">❓ 询问本人</button>
        <button class="va-chip${cur.remind?' on':''}" onclick="toggleAction('${esc(p.id)}','remind')">🔔 提醒DJ</button>
      </div>
    </div>`;

  // 留言输入框（常驻卡片上，选礼物面板上方）
  const msgHTML = `<div class="msg-row"><input class="msg-input" id="msg-${esc(p.id)}" placeholder="输入内容" value="${esc(cur.msg||'')}" oninput="saveMsg('${esc(p.id)}', this.value)"></div>`;

  return `<div class="viewer-person${pickedG?' is-picked':''}" data-pid="${esc(p.id)}" id="vp-${esc(p.id)}">
    <div class="viewer-name-row">
      <span class="vname">${esc(p.name)}</span>
      <span class="vdate">${esc(dateStr || p.dateRaw || '')}</span>
      ${vipBadge}
      <button class="picker-btn${isOpen?' is-open':''}" id="pb-${esc(p.id)}" onclick="togglePicker('${esc(p.id)}')">🎁 为他 / 她选礼物</button>
    </div>
    ${miniHTML}
    ${msgHTML}
    ${pickerHTML}
  </div>`;
}
function togglePicker(pid){
  const ip = document.getElementById('ip-' + pid);
  const pb = document.getElementById('pb-' + pid);
  if (!ip) return;
  const open = ip.classList.toggle('open');
  if (open) openPickers.add(pid); else openPickers.delete(pid);
  if (pb) pb.classList.toggle('is-open', open);
  // 展开时滚动到 picker 顶部
  if (open){
    setTimeout(()=>{
      try { ip.scrollIntoView({behavior:'smooth', block:'nearest'}); }
      catch(e){ try{ ip.scrollIntoView(); }catch(_){} }
    }, 60);
  }
}
function refreshCard(pid){
  const wrap = document.getElementById('vp-' + pid);
  if (!wrap) return;
  const p = findPerson(pid);
  if (!p) return;
  const y = window.scrollY || document.documentElement.scrollTop || 0;
  wrap.outerHTML = personCardHTML(p);
  try { window.scrollTo(0, y); } catch(e){}
}
function renderList(){
  const people = (state.people||[]).filter(p => p.month === MONTH);
  const totalAll = (state.people||[]).length;
  const vips = people.filter(p=>p.tier==='vip').length;
  const staff = people.length - vips;
  $('#vr-title').textContent = `${YEAR} 年 ${MONTH} 月 · 生日礼物人员`;
  $('#vr-meta').innerHTML = `<span>${people.length} 位寿星</span><span>VIP ${vips} 位</span><span>普通员工 ${staff} 位</span>`;
  const list = $('#viewer-list');
  if (!people.length){
    list.innerHTML = `<div class="empty-state"><div class="big">🎂</div><p>${YEAR}年${MONTH}月没有生日人员</p></div>`;
    return;
  }
  const sorted = people.slice().sort((a,b) => (a.day||99) - (b.day||99));
  list.innerHTML = sorted.map(p => personCardHTML(p)).join('');
}
function updateFootBar(){
  const ids = Object.keys(picks);
  const picked = ids.filter(id => picks[id] && picks[id].gid).length;
  const active = ids.filter(id => {
    const c = picks[id];
    return !!(c && (c.gid || c.ask || c.remind || c.resetMark || (c.msg && c.msg.trim())));
  }).length;
  const meta = $('#vf-meta');
  if (meta){
    if (!active) meta.textContent = '尚未勾选';
    else meta.textContent = `已选 ${picked} 位 · ${active} 人有内容`;
  }
  const btn = $('#submit-btn');
  if (btn) btn.disabled = (active === 0);
}

/* ====== 提交：把勾选结果写入云端 data.enc，附在 people[*].selected ====== */
let _subBusy = false;
async function submitPicks(){
  if (_subBusy) return;
  const btn = $('#submit-btn'); if (!btn) return;
  if (btn.disabled) return;
  _subBusy = true;
  const oldText = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ 正在上传…';
  try {
    syncBadge('☁️ 提交中…');
    // 1. 拉取最新 data.enc
    let remote;
    for (let attempt=0; attempt<3; attempt++){
      try { remote = await cloudGet(); break; }
      catch(e){ if (attempt<2){ await new Promise(r => setTimeout(r, 1500)); continue; } throw e; }
    }
    // 2. 把本次提交写入 state.people[*]
    const submittedAt = Date.now();
    const submittedBy = 'viewer';
    if (!remote.state){
      // 远端还没数据 → 用本地 state 作底，再叠提交
      loadState();
    } else {
      state = remote.state;
    }
    (state.people||[]).forEach(p => {
      const cur = picks[p.id];
      if (cur && (cur.gid || cur.ask || cur.remind || cur.resetMark || (cur.msg && cur.msg.trim()))){
        p.selected = {
          gid: cur.gid || null,
          gift: cur.gift || null,
          price: cur.price || null,
          ask: !!cur.ask,
          remind: !!cur.remind,
          resetMark: !!cur.resetMark,
          msg: (cur.msg || '').trim() || null,
          at: submittedAt,
          by: submittedBy,
        };
      } else {
        p.selected = null;
      }
    });
    // 3. 加密推送（带 sha 乐观锁，409 自动重试一次）
    let newSha = null;
    for (let attempt=0; attempt<2; attempt++){
      const enc = await encryptState(state);
      newSha = await cloudPut(remote.sha, enc);
      if (newSha) break;
      // 409：远端刚被改过，重拉再合
      try { remote = await cloudGet(); state = remote.state; }
      catch(e){ /* 第二次失败就放弃 */ break; }
    }
    if (!newSha) throw new Error('PUT 失败，请稍后再试');
    syncBadge('✅ 已提交 · ' + new Date().toTimeString().slice(0,5), 'ok');
    toast('✅ 已提交，后台 45 秒内可见');
    btn.textContent = '✅ 已提交';
    setTimeout(()=>{ btn.textContent = oldText; updateFootBar(); }, 4000);
  } catch(e){
    console.error(e);
    syncBadge('⚠️ 提交失败：'+ (e&&e.message||e), 'warn');
    toast('❌ 提交失败：'+ (e&&e.message||e));
    btn.textContent = oldText;
    updateFootBar();
  } finally {
    _subBusy = false;
  }
}

/* ====== 轻量后台同步：每 45s 拉一次数据 ====== */
let _pullTimer = null;
async function viewPull(){
  try {
    const remote = await cloudGet();
    if (!remote || !remote.state) return;
    state = remote.state;
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    renderList();
    try { window.scrollTo(0, y); } catch(e){}
    syncBadge('☁️ 已更新 · ' + new Date().toTimeString().slice(0,5), 'ok');
  } catch(e){
    syncBadge('⚠️ 网络不通', 'warn');
  }
}
function startPullLoop(){
  clearInterval(_pullTimer);
  _pullTimer = setInterval(viewPull, 45000);
  window.addEventListener('focus', viewPull);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) viewPull(); });
}

/* ====== 启动 ====== */
(async function(){
  try {
    loadState();
    loadPicks();
    renderList();
    updateFootBar();
    syncBadge('☁️ 拉取最新名单…');
    await viewPull();         // 立即拉一次（拿到 imgUrl 等远端字段）
    startPullLoop();
  } catch(e){
    console.error(e);
    syncBadge('❌ 加载失败','warn');
  }
})();
</script>
