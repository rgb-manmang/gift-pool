<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生日礼物管理 · 登录</title>
<script>
// 短链入口：/?r=<云端报告ID> 或 /?r=<v3串> 或 /?rp=<旧版> → 不进登录，直接转给观阅报告页
try {
  var __q = location.search || '';
  if (/[?&](r|rp)=/.test(__q)) location.replace('gift-report.html' + __q);
} catch(e){}
// 提前热身：页面一加载就开始下载 app.enc（与后续 PBKDF2 密钥推导并行，省一次串行等待）
try { window.__preEncP = fetch('./app.enc', { cache: 'no-store' }).catch(function(){ return null; }); } catch(e){}
</script>
<style>
  :root{
    --ink:#1f2733; --ink2:#5b6675; --ink3:#98a2b3;
    --gold:#c8a253; --gold-bg:#faf5ea; --line:#e8e4da;
    --bg:#f6f4ef; --card:#ffffff; --err:#d64545;
    --ok:#3b8a5a; --ok-bg:#eef7f0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(1200px 500px at 50% -10%, #efe9dc 0%, var(--bg) 55%);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,sans-serif;padding:24px}
  .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px 30px;box-shadow:0 18px 50px -18px rgba(31,39,51,.18)}
  .logo{width:54px;height:54px;border-radius:16px;background:var(--gold-bg);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px}
  h1{font-size:19px;color:var(--ink);text-align:center;letter-spacing:.5px}
  .sub{font-size:12.5px;color:var(--ink3);text-align:center;margin:7px 0 24px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.3px}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:.16s;background:#fdfdfb;color:var(--ink)}
  .field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,162,83,.14);background:#fff}
  .remember-row{display:flex;align-items:center;gap:8px;margin:6px 2px 14px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none}
  .remember-row input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
  .remember-row span{flex:1;line-height:1.4}
  .btn{width:100%;padding:13px 0;border:none;border-radius:12px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:.18s;letter-spacing:2px;margin-top:8px}
  .btn:hover{background:#2c3646}
  .btn:disabled{opacity:.55;cursor:wait}
  .err{display:none;background:#fdf0f0;border:1px solid #f3d6d6;color:var(--err);font-size:12.5px;padding:9px 12px;border-radius:10px;margin-bottom:14px;text-align:center}
  .welcome{display:none;font-size:12.5px;color:var(--ok);background:var(--ok-bg);border:1px solid #cfe8d8;border-radius:10px;padding:9px 12px;margin-bottom:14px;text-align:center;line-height:1.5}
  .welcome b{font-weight:700}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .loading{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:9}
  .loading.show{display:flex}
  .spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .loading p{font-size:13px;color:var(--ink2);text-align:center;line-height:1.6;padding:0 24px}
  .foot{margin-top:20px;text-align:center;font-size:11px;color:var(--ink3);line-height:1.6}
</style>
</head><body>

<div class="loading" id="loading"><div class="spin"></div><div id="loading-txt" style="font-size:13px;color:var(--ink2);text-align:center;line-height:1.6">正在解锁…</div></div>

<div class="box" id="login-box" style="display:none">
  <div class="logo">🎁</div>
  <h1>生日礼物管理</h1>
  <p class="sub">后台已加密，请输入你的账号密码</p>
  <div class="welcome" id="welcome"></div>
  <div class="err" id="err"></div>
  <form id="login-form">
    <div class="field"><label>账号</label><input id="acc" list="acc-list" placeholder="请输入你的名字" autocomplete="username" spellcheck="false" autocapitalize="off"></div>
    <datalist id="acc-list">
      <option value="黄亮"></option>
      <option value="婧晗"></option>
      <option value="晓英"></option>
      <option value="志良"></option>
    </datalist>
    <div class="field"><label>密码</label><input id="pwd" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
    <label class="remember-row"><input type="checkbox" id="remember" checked><span>记住账号密码，下次打开自动登录</span></label>
    <button class="btn" id="go" type="submit">进 入</button>
    <p class="foot">勾选记住后，下次打开自动进入，无需再输入<br>不勾选也会记住账号，下次只需输密码<br>在后台点「🚪 退出」可清除本机记忆</p>
  </form>
</div>

<script>
(function(){
  var STORE_KEY = 'gp_auth_v1';   // 记住的账号+密码（勾选"记住"才写）
  var ACC_KEY   = 'gp_acc_v1';    // 上次登录的账号名（登录成功就写，用于下次自动填好）
  var $ = function(id){ return document.getElementById(id); };
  var _curUser = null;            // 当前正在登录的人（用于解锁提示）
  function showWelcome(name){
    var w = $('welcome');
    if (!w || !name) return;
    w.innerHTML = '👋 欢迎回来，<b>' + name + '</b>　账号已填好，直接点「进入」即可';
    w.style.display = 'block';
  }
  function showLoading(t){
    if (Array.isArray(t)) t = t.join('  ·  ');
    $('loading-txt').textContent = t || '正在解锁…';
    $('loading').classList.add('show');
  }
  function hideLoading(){ $('loading').classList.remove('show'); }
  function showLogin(){
    hideLoading();
    var b = $('login-box'); b.style.display = 'block';
    try { $('acc').focus(); } catch(e){}
  }
  function showError(msg){
    var e = $('err'); e.textContent = msg; e.style.display = 'block';
    var b = $('login-box'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  }
  function hideError(){
    var e = $('err'); e.style.display = 'none';
  }

  /* ===== 账号表（四人专用）=====
     账号支持中文名字，也兼容拼音/首字母别名（输入 huangliang 或 hl 等同于 黄亮） */
  var USERS = [
    { name: '黄亮', pwd: '123456', alias: ['huangliang', 'hl'] },
    { name: '婧晗', pwd: '123456', alias: ['jinghan', 'jh'] },
    { name: '晓英', pwd: '123456', alias: ['xiaoying', 'xy'] },
    { name: '志良', pwd: '123456', alias: ['zhiliang', 'zl'] }
  ];
  /* 加密主密钥：与账号解耦——改账号/加人无需重新加密 app.enc */
  var MASTER = 'giftpool:master:v1';

  function findUser(acc){
    var a = String(acc || '').trim();
    if (!a) return null;
    var la = a.toLowerCase();
    for (var i = 0; i < USERS.length; i++){
      var u = USERS[i];
      if (u.name === a || String(u.name).toLowerCase() === la) return u;
      if (u.alias){
        for (var j = 0; j < u.alias.length; j++){
          if (String(u.alias[j]).toLowerCase() === la) return u;
        }
      }
    }
    return null;
  }
  function verify(acc, pwd){
    var u = findUser(acc);
    if (!u) return null;
    return (String(pwd || '').trim() === u.pwd) ? u : null;
  }
  // 记住当前登录人：后台顶部会显示；ACC_KEY 让下次打开自动填好账号
  function setUser(u){
    try { localStorage.setItem('gp_user_v1', u.name); } catch(e){}
    try { localStorage.setItem(ACC_KEY, u.name); } catch(e){}
  }
  function loadAcc(){
    try { return localStorage.getItem(ACC_KEY) || ''; } catch(e){ return ''; }
  }

  // —— 记住密码（base64 简单混淆，不构成真正的安全，只是避免明文直接落盘） ——
  function saveAuth(u, pwd){
    setUser(u);
    try {
      var payload = { a: u.name, p: pwd, t: Date.now() };
      localStorage.setItem(STORE_KEY, btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
    } catch(e){}
  }
  function loadAuth(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var payload = JSON.parse(decodeURIComponent(escape(atob(raw))));
      if (!payload || !payload.a || !payload.p) return null;
      return { a: payload.a, p: payload.p };
    } catch(e){ return null; }
  }
  // full=true：连"上次登录的账号"一起忘掉（账号已不在四人名单时用）
  function clearAuth(full){
    try { localStorage.removeItem(STORE_KEY); localStorage.removeItem('gp_user_v1'); } catch(e){}
    if (full){ try { localStorage.removeItem(ACC_KEY); } catch(e){} }
  }

  function deriveKey(secret, salt){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: 60000, hash: 'SHA-256' },
          km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
      });
  }
  function fetchEnc(){
    var fp = window.__preEncP;
    if (fp){
      return fp.then(function(r){
        if (r && r.ok) return r.arrayBuffer();
        return fetch('./app.enc?v=' + Date.now(), { cache: 'no-store' }).then(function(r2){
          if (!r2.ok) throw new Error('FETCH_' + r2.status);
          return r2.arrayBuffer();
        });
      });
    }
    return fetch('./app.enc?v=' + Date.now(), { cache: 'no-store' }).then(function(r){
      if (!r.ok) throw new Error('FETCH_' + r.status);
      return r.arrayBuffer();
    });
  }
  // beforeWrite：解密成功、document.write 之前调用（用于把账号密码写到 localStorage）
  function boot(secret, beforeWrite){
    showLoading([(_curUser ? '正在以 ' + _curUser + ' 的身份进入…' : '正在解锁…'), '派生密钥中…', '校验加密数据…']);
    return fetchEnc()
      .then(function(buf){
        if (buf.byteLength < 45) throw new Error('BADFILE');
        var salt = new Uint8Array(buf, 0, 16);
        var iv = new Uint8Array(buf, 16, 12);
        var ct = new Uint8Array(buf, 28);
        return deriveKey(secret, salt).then(function(key){
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
        });
      })
      .then(function(plain){
        var html = new TextDecoder('utf-8').decode(plain);
        if (html.indexOf('<!doctype') !== 0 && html.indexOf('<!DOCTYPE') !== 0) throw new Error('BADPLAIN');
        if (beforeWrite) { try { beforeWrite(); } catch(e){} }
        document.open(); document.write(html); document.close();
      });
  }
  function onFail(err){
    hideLoading();
    if (err && String(err.message || err).indexOf('FETCH') === 0){
      showLogin();
      showError('网络异常，无法获取数据（' + String(err.message || err).replace('FETCH_','HTTP ') + '），请刷新重试');
    } else {
      // 密码错误 —— 清除记住的密码，回到登录框让用户重新输入
      clearAuth();
      showLogin();
      showError('账号或密码不正确');
      try { $('pwd').value = ''; if (!$('acc').value) $('acc').value = loadAcc(); $('pwd').focus(); } catch(e){}
    }
  }

  $('login-form').addEventListener('submit', function(ev){
    ev.preventDefault();
    var acc = $('acc').value.trim();
    var pwd = $('pwd').value.trim();
    if (!acc || !pwd){ showError('请输入账号和密码'); return; }
    var u = findUser(acc);
    if (!u){ showError('账号不存在，请输入你的名字'); return; }
    if (String(u.pwd) !== pwd){ showError('密码不正确'); return; }
    hideError();
    $('go').disabled = true;
    var remember = $('remember').checked;
    _curUser = u.name;
    var saveCb = remember ? function(){ saveAuth(u, pwd); } : function(){ setUser(u); };
    boot(MASTER, saveCb)
      .catch(function(e){ onFail(e); })
      .then(function(){ try { $('go').disabled = false; } catch(e){} });
  });

  /* —— 自动登录 ——
     1) 之前勾过"记住密码"：直接用记住的账号密码进入，无需任何操作
     2) 只登录过、没勾记住：账号自动填好 + "欢迎回来"，点「进入」即可
     3) 旧记忆账号（如 djlwc）不在四人名单：静默清理，不报错 */
  var remembered = loadAuth();
  if (remembered){
    var ru = verify(remembered.a, remembered.p);
    if (ru){
      _curUser = ru.name;
      setUser(ru);
      boot(MASTER).catch(function(e){ onFail(e); });
    } else {
      clearAuth(true);
      showLogin();
    }
  } else {
    var lastAcc = loadAcc();
    var lu = lastAcc ? findUser(lastAcc) : null;
    showLogin();
    if (lu){
      try { $('acc').value = lu.name; } catch(e){}
      showWelcome(lu.name);
      try { $('pwd').focus(); } catch(e){}
    }
  }
})();
</script>
</body></html>
